<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glazeir | Aesthetic Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #e6edf3; font-family: sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .unavailable { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
        .badge { background: #ff4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>
    <nav class="p-4 border-b border-gray-800 sticky top-0 bg-[#0d1117] z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-500 tracking-tighter">THE GLAZEIR</h1>
        <div class="relative w-1/2">
            <input type="text" placeholder="খুঁজুন..." class="w-full bg-gray-900 border border-gray-700 rounded-full py-1 px-8 text-sm focus:outline-none">
        </div>
    </nav>

    <main class="container mx-auto p-4 space-y-8">
        <section id="resin">
            <h2 class="text-lg font-bold text-pink-400 mb-4 border-b border-gray-800 pb-2">Resin Keychains (Available)</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="glass-card rounded-lg p-3">
                    <img src="https://i.ibb.co/qF6Lg8K/1000149528.png" class="w-full h-40 object-contain rounded mb-2 bg-white">
                    <h3 class="text-xs font-bold text-center">Amethyst Garden</h3>
                    <p class="text-pink-400 text-sm font-bold text-center">৳ ১৯৬ <span class="text-[10px] line-through text-gray-500">৳ ২৮০</span></p>
                    <button onclick="order('Amethyst Garden', 196)" class="w-full bg-green-600 text-[10px] py-2 rounded font-bold mt-2">WhatsApp Order</button>
                </div>
                <div class="glass-card rounded-lg p-3">
                    <img src="https://i.ibb.co/L8yX7M0/1000149525.png" class="w-full h-40 object-contain rounded mb-2 bg-white">
                    <h3 class="text-xs font-bold text-center">Ivory Duo</h3>
                    <p class="text-pink-400 text-sm font-bold text-center">৳ ১৯৬ <span class="text-[10px] line-through text-gray-500">৳ ২৮০</span></p>
                    <button onclick="order('Ivory Duo', 196)" class="w-full bg-green-600 text-[10px] py-2 rounded font-bold mt-2">WhatsApp Order</button>
                </div>
                <div class="glass-card rounded-lg p-3">
                    <img src="https://i.ibb.co/sK08rP6/1000149517.png" class="w-full h-40 object-contain rounded mb-2 bg-white">
                    <h3 class="text-xs font-bold text-center">Ruby Crimson</h3>
                    <p class="text-pink-400 text-sm font-bold text-center">৳ ১৯৬ <span class="text-[10px] line-through text-gray-500">৳ ২৮০</span></p>
                    <button onclick="order('Ruby Crimson', 196)" class="w-full bg-green-600 text-[10px] py-2 rounded font-bold mt-2">WhatsApp Order</button>
                </div>
            </div>
        </section>

        <section class="unavailable relative">
            <span class="badge">Coming Soon</span>
            <h2 class="text-lg font-bold text-blue-400 mb-4 border-b border-gray-800 pb-2">Anime & Gaming Collection</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-card rounded-lg p-3 h-32"></div>
                <div class="glass-card rounded-lg p-3 h-32"></div>
            </div>
        </section>
    </main>

    <script>
        function order(name, price) {
            const num = "8801700000000"; // এখানে আপনার নম্বর বসান
            const msg = `Hello The Glazeir! Ami order korte chai:\nProduct: ${name}\nPrice: ৳${price}`;
            window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
