<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glazeir | Aesthetic Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #e6edf3; font-family: sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .cart-modal { display: none; position: fixed; right: 0; top: 0; width: 100%; max-width: 350px; height: 100%; background: #161b22; z-index: 1000; box-shadow: -5px 0 15px rgba(0,0,0,0.5); padding: 20px; }
        .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #21262d; }
    </style>
</head>
<body>

    <nav class="p-4 border-b border-gray-800 sticky top-0 bg-[#0d1117] z-50">
        <div class="flex justify-between items-center mb-3">
            <h1 class="text-xl font-bold text-blue-500">THE GLAZEIR</h1>
            <button onclick="toggleCart()" class="relative p-2 text-xl">
                <i class="fa fa-shopping-cart text-gray-300"></i>
                <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-[10px] rounded-full h-4 w-4 flex items-center justify-center">0</span>
            </button>
        </div>
        <div class="relative">
            <input type="text" id="searchInput" onkeyup="searchProduct()" placeholder="Search items..." 
                class="w-full bg-gray-900 border border-gray-700 rounded-full py-2 px-10 text-sm text-gray-200 outline-none focus:border-blue-500">
            <i class="fa fa-search absolute left-4 top-3 text-gray-500 text-sm"></i>
        </div>
    </nav>

    <div class="flex overflow-x-auto p-4 gap-3 border-b border-gray-800 no-scrollbar">
        <button onclick="filterCat('all')" class="px-5 py-1 rounded-full bg-blue-600 text-xs font-bold">All</button>
        <button onclick="filterCat('Resin')" class="px-5 py-1 rounded-full bg-gray-800 text-xs font-bold">Resin</button>
        <button onclick="filterCat('Anime')" class="px-5 py-1 rounded-full bg-gray-800 text-xs font-bold">Anime</button>
        <button onclick="filterCat('Decor')" class="px-5 py-1 rounded-full bg-gray-800 text-xs font-bold">Decor</button>
    </div>

    <main class="container mx-auto p-4">
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            
            <div class="glass-card rounded-lg p-3 product-item" data-name="Amethyst Garden" data-cat="Resin">
                <img src="https://raw.githubusercontent.com/e7793016-sketch/the-glazeir/main/1000149528.png" class="product-img">
                <h3 class="text-xs font-bold text-center">Amethyst Garden</h3>
                <p class="text-pink-400 text-sm font-bold text-center">৳ ১৯৬</p>
                <button onclick="addToCart('Amethyst Garden', 196)" class="w-full bg-blue-600 text-[10px] py-2 rounded font-bold mt-2">Add to Cart</button>
            </div>

            <div class="glass-card rounded-lg p-3 product-item" data-name="Ivory Duo" data-cat="Resin">
                <img src="https://raw.githubusercontent.com/e7793016-sketch/the-glazeir/main/1000149525.png" class="product-img">
                <h3 class="text-xs font-bold text-center">Ivory Duo</h3>
                <p class="text-pink-400 text-sm font-bold text-center">৳ ১৯৬</p>
                <button onclick="addToCart('Ivory Duo', 196)" class="w-full bg-blue-600 text-[10px] py-2 rounded font-bold mt-2">Add to Cart</button>
            </div>

            <div class="glass-card rounded-lg p-3 product-item" data-name="Ruby Crimson" data-cat="Resin">
                <img src="https://raw.githubusercontent.com/e7793016-sketch/the-glazeir/main/1000149517.png" class="product-img">
                <h3 class="text-xs font-bold text-center">Ruby Crimson</h3>
                <p class="text-pink-400 text-sm font-bold text-center">৳ ১৯৬</p>
                <button onclick="addToCart('Ruby Crimson', 196)" class="w-full bg-blue-600 text-[10px] py-2 rounded font-bold mt-2">Add to Cart</button>
            </div>

        </div>
    </main>

    <div id="cartModal" class="cart-modal">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-bold">Your Cart</h2>
            <button onclick="toggleCart()"><i class="fa fa-times text-gray-500"></i></button>
        </div>
        <div id="cartItems" class="space-y-3 mb-6"></div>
        <div class="border-t border-gray-700 pt-4 font-bold text-sm">
            <p class="flex justify-between mb-4">Total: <span id="cartTotal" class="text-blue-400">৳ 0</span></p>
            <button onclick="showCheckout()" class="w-full bg-green-600 py-3 rounded-lg">Confirm Order</button>
        </div>
    </div>

    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-90 z-[2000] hidden p-4 flex items-center justify-center">
        <div class="bg-[#161b22] p-6 rounded-xl w-full max-w-md">
            <h2 class="text-lg font-bold mb-4 text-center">Delivery Info</h2>
            <form action="https://formspree.io/f/e7793016@gmail.com" method="POST">
                <input type="hidden" name="Order_List" id="orderInput">
                <input type="text" name="Name" placeholder="Name" class="w-full bg-gray-800 p-2 rounded mb-3 text-sm outline-none" required>
                <input type="tel" name="Phone" placeholder="Phone Number" class="w-full bg-gray-800 p-2 rounded mb-3 text-sm outline-none" required>
                <textarea name="Address" placeholder="Full Address" class="w-full bg-gray-800 p-2 rounded mb-3 text-sm outline-none" rows="3" required></textarea>
                <button type="submit" class="w-full bg-blue-600 py-3 rounded font-bold">Submit</button>
            </form>
            <button onclick="hideCheckout()" class="w-full mt-2 text-gray-600 text-xs text-center">Cancel</button>
        </div>
    </div>

    <script>
        let cart = [];
        function toggleCart() { const m = document.getElementById('cartModal'); m.style.display = (m.style.display === 'block') ? 'none' : 'block'; }
        function addToCart(name, price) { cart.push({name, price}); updateCart(); toggleCart(); }
        function removeFromCart(index) { cart.splice(index, 1); updateCart(); }

        function updateCart() {
            const list = document.getElementById('cartItems');
            list.innerHTML = ''; let total = 0;
            cart.forEach((i, index) => {
                list.innerHTML += `<div class="flex justify-between bg-gray-800 p-2 rounded text-xs">
                    <span>${i.name}</span>
                    <div class="flex gap-2"><span>৳ ${i.price}</span><button onclick="removeFromCart(${index})" class="text-red-500"><i class="fa fa-trash"></i></button></div>
                </div>`;
                total += i.price;
            });
            document.getElementById('cartCount').innerText = cart.length;
            document.getElementById('cartTotal').innerText = '৳ ' + total;
            document.getElementById('orderInput').value = cart.map(i => i.name).join(', ') + " | Total: " + total;
        }

        function searchProduct() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.getElementsByClassName('product-item');
            for (let i = 0; i < items.length; i++) {
                let name = items[i].getAttribute('data-name').toLowerCase();
                items[i].style.display = name.includes(input) ? "" : "none";
            }
        }

        function filterCat(cat) {
            let items = document.getElementsByClassName('product-item');
            for (let i = 0; i < items.length; i++) {
                let itemCat = items[i].getAttribute('data-cat');
                items[i].style.display = (cat === 'all' || itemCat === cat) ? "" : "none";
            }
        }
        function showCheckout() { if(cart.length > 0) document.getElementById('checkoutModal').classList.remove('hidden'); }
        function hideCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); }
    </script>
</body>
</html>
